version: '3'
services:

    cache:
        container_name: netapi_webui_cache
        image: memcached:1.4.33
        networks:
            - globonetworkapi_netapi_net

    netapi_webui:
        container_name: netapi_webui_app
        build: .
        ports:
            - "8080:8080"
            - "8081:8081"
        command: sh scripts/docker/docker-start-debug.sh
        env_file:
            - config/netapi_webui.env
        environment:
            - MEMCACHED_HOST=netapi_webui_cache:11211
            - ALLOWED_HOSTS=localhost,127.0.0.1
            - LOG_TO_STDOUT=1
            # Keep default until you wire to your backend
            # - NETWORK_API_URL=http://netapi_app:8000/
        volumes:
            - .:/netapi_webui
        networks:
            - globonetworkapi_netapi_net
        depends_on:
            - cache
        external_links:
            - netapi_app
            - cache:netapi_webui_cache

networks:
    globonetworkapi_netapi_net:
        external: true
